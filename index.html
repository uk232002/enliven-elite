        mixHand(SB.R, POSE.restR, POSE.explR, wB);
        mixHand(SB.L, POSE.restL, POSE.explL, wB);
        const bB = env(t, 3.9, 4.3, 5.5, 5.8), pB = (Math.PI * 2 * (t - 4.1)) / 0.8;
        const spread = 0.06 * Math.sin(pB) * bB, lift = 0.02 * Math.sin(pB * 2) * bB;
        SB.R.at.x -= spread; SB.L.at.x += spread;
        SB.R.at.y += lift; SB.L.at.y += lift;
        SB.lean += 0.06 * wB; SB.nod += 0.05 * Math.sin(pB) * bB;
        SA.nod += 0.22 * (bump(t, 4.3, 0.55) + bump(t, 5.05, 0.55) + bump(t, 5.9, 0.6));

        // and they shake on it
        const wS = env(t, 6.3, 7.4, 8.7, 9.7);
        const pump = 0.035 * Math.sin((Math.PI * 2 * (t - 7.4)) / 0.4) * env(t, 7.4, 7.55, 8.45, 8.6);
        [SA, SB].forEach((F) => {
          mixHand(F.R, F.R, POSE.shakeR, wS);
          F.R.at.y += pump;
          F.reach = 0.12 * wS;
          F.lean += 0.2 * wS; F.twist += 0.12 * wS;
          F.nod += 0.1 * bump(t, 7.5, 0.9);
        });
      }

      const figures = [];
      const _fq = new THREE.Quaternion(), _rq = new THREE.Quaternion(), _lq = new THREE.Quaternion();
      const _lat = new THREE.Vector3(), _up = new THREE.Vector3(), _fwd = new THREE.Vector3();
      const _t = new THREE.Vector3(), _pl = new THREE.Vector3(), _fd = new THREE.Vector3(), _pd = new THREE.Vector3();
      function sit(fig, st) {
        const { frame, rig, P } = fig;
        P.reset();
        frame.updateWorldMatrix(true, true);
        frame.getWorldQuaternion(_fq);
        _lat.set(1, 0, 0).applyQuaternion(_fq);
        _up.set(0, 1, 0).applyQuaternion(_fq);
        _fwd.set(0, 0, 1).applyQuaternion(_fq);

        P.turnW(P.hips, _lat, st.lean * 0.55);
        P.spine.forEach((b) => {
          P.turnW(b, _lat, st.lean * 0.15);
          P.turnW(b, _up, st.twist / 3);
          P.turnW(b, _fwd, st.sway / 3);
        });
        P.turnW(P.hands.R.clavicle, _up, st.reach);   // the reaching shoulder comes forward
        P.turnW(P.neck, _lat, st.nod * 0.4);
        P.turnW(P.head, _lat, st.nod * 0.6);
        P.turnW(P.head, _fwd, st.tilt);

        // Legs: ankles on the floor a little behind the knees, soles flat.
        rig.getWorldQuaternion(_rq);
        ['L', 'R'].forEach((s) => {
          frame.localToWorld(_t.set(s === 'L' ? 0.11 : -0.11, ANKLE_H, 0.27));
          P.solve(s === 'L' ? P.limbs.legL : P.limbs.legR, _t, _pl.set(0, 1, 0.6).applyQuaternion(_fq), _lq);
          P.setWorldQ(P.feet[s], _lq.copy(_rq).multiply(P.footRest[s]));
        });

        ['L', 'R'].forEach((s) => {
          const h = st[s];
          frame.localToWorld(_t.copy(h.at));
          _pl.copy(h.pole).applyQuaternion(_fq);
          _fd.set(1, 0, 0).applyQuaternion(h.q).applyQuaternion(_fq);
          _pd.set(0, 1, 0).applyQuaternion(h.q).applyQuaternion(_fq);
          P.placeHand(s, _t, _pl, _fd, _pd);
          P.curl(s, h.curl, h.thumbIn, h.thumbCurl);
        });
      }

      /* Struck in platinumMat itself, the table's own material, rather than a
         clone: nothing writes this one's opacity but the frame loop, so the
         sitters fade in and out with their furniture. */
      new FBXLoader().load(CONSULT_URL, (src) => {
        // Cloned before anything is posed, so both start from the same T-pose.
        [src, cloneRig(src)].forEach((rig, i) => {
          rig.traverse((o) => {
            if (o.isMesh || o.isSkinnedMesh) {
              o.material = platinumMat;
              // A skinned mesh deforms outside the bounds it was built with.
              o.frustumCulled = false;
            }
          });
          const frame = frames[i];
          frame.add(rig);
          const P = seatedPoser(rig);
          /* Sized to TALL, soles to crown, and sat with the hip joints over
             the seat - a little behind its centre, where a seated pelvis
             rests. Measured in the rig's own frame, off the skeleton: Box3
             would read the skinned mesh in its bind pose. */
          rig.updateWorldMatrix(true, true);
          const inv = new THREE.Matrix4().copy(rig.matrixWorld).invert();
          const at = (n) => P.bone(n).getWorldPosition(new THREE.Vector3()).applyMatrix4(inv);
          const k = TALL / (at('HeadTop_End').y - at('LeftToe_End').y);
          const hip = at('LeftUpLeg').add(at('RightUpLeg')).multiplyScalar(0.5);
          rig.scale.setScalar(k);
          rig.position.set(-hip.x * k, SEAT_H + HIP_UP - hip.y * k, HIP_Z - hip.z * k);
          figures.push({ frame, rig, P });
        });
      }, undefined, () => { /* offline or file:// - the table and chairs stand empty */ });

      root.userData.tick = function (t) {
        if (figures.length < 2) return;
        // Set from the clock outright, like the other figures, so a spell in a
        // background tab comes back in step rather than catching up.
        timeline(t % LOOP);
        sit(figures[0], SA);
        sit(figures[1], SB);
      };

      return root;
    }

    /* ---- Slot 3: insights ------------------------------------------------
       The reference clip: a head in profile, talking, with a thought lifting
       away from it. Same machinery as slot 1 - captured once and ping-ponged
       - but keyed on the opposite thing. This clip is a bright silhouette on
       black, where the handshake was a subject on a bright cyan sweep, so
       here plain luminance does the separating. Measured over the clip: the
       backdrop lies under 0.125 and the figure over 0.31, with only about 2%
       of the frame in between.

       Nothing touches the edges of this crop - the head's neck tapers out
       above the bottom and the thought clears the top - so unlike slot 1
       there is no edge fade to soften a cut that is not there. The crop does
       stop short of the source's right-hand side on purpose: there is a small
       decorative sparkle baked into the corner at x 0.88-0.94 that has no
       business in a nav icon, and cropping is the cheapest way to be rid of
       it. */
    /* ---- Slot 4: telling a secret -----------------------------------------
       Was the keyed speaking-head clip; now the Mixamo capture shipped as
       insights-secret.fbx, struck in the same platinum as the rest. A whisper
       is a better figure for this slot than a talking head was: insight is
       something passed to you, not broadcast at you.

       The export arrived at 20 MB, of which 18.6 was one embedded texture
       these icons can never show - they draw in a single flat material. The
       stripped file is 1.4 MB with the mesh, the 65-bone skeleton and the
       10.9s clip intact. Unlike the door there is no built stand-in behind
       this one: if the fetch fails the slot stays empty, and its label and
       button still work. */
    const SECRET_URL = './insights-secret.fbx';

    function buildInsightsModel() {
      const root = new THREE.Group();

      /* ITS OWN MATERIAL, not the shared manMat. The door figure's tick writes
         manMat.opacity every frame for its fade; a second figure sharing it
         would mean whichever ticked last owned the opacity, and both would
         flicker. Cloned after applyTheme has run so it starts on the current
         theme, and registered so it follows later changes. */
      const secretMat = manMat.clone();
      SOLID_MATS.push(secretMat);

      let mixer = null, clipDur = 1;

      new FBXLoader().load(SECRET_URL, (rig) => {
        rig.traverse((o) => {
          if (o.isMesh || o.isSkinnedMesh) {
            o.material = secretMat;
            // Skinning deforms outside the bounds the mesh was built with.
            o.frustumCulled = false;
          }
        });

        const src = rig.animations && rig.animations[0];
        if (!src) return;
        // Same one-frame trim as the door: Mixamo closes a take by repeating
        // frame 0, which puts a snap at the end of every loop. 327 frames.
        const clip = THREE.AnimationUtils.subclip(src, 'secret', 0, 325, 30);
        clipDur = clip.duration;
        mixer = new THREE.AnimationMixer(rig);
        mixer.clipAction(clip).play();

        /* Sized and centred off the POSED skeleton rather than a bounding box.
           Box3.setFromObject reads a skinned mesh in its bind pose and ignores
           the skeleton entirely, and this rig is authored with the mesh centred
           on the origin while the skeleton stands on it - trusting the box puts
           him three quarters of a metre out. */
        mixer.setTime(0);
        rig.updateMatrixWorld(true);
        const V = () => new THREE.Vector3();
        const crown = rig.getObjectByName('mixamorigHeadTop_End');
        const hips = rig.getObjectByName('mixamorigHips');
        const head = rig.getObjectByName('mixamorigHead') || crown;

        if (crown && hips) {
          const yTop = crown.getWorldPosition(V()).y;
          const yWaist = hips.getWorldPosition(V()).y;

          /* A BUST, not a full figure. What carries this slot is his face and
             the hand cupped beside it; at full height both were a few pixels
             across and the legs were most of the cell. So the frame is set on
             crown-to-waist instead, which roughly doubles him.

             The legs cannot simply be pushed out of frame - there is no clip
             rectangle here, every icon shares one canvas, and they would just
             hang over the caption. They are faded out in the shader below. */
          const FADE = (yTop - yWaist) * 0.34;      // soft band below the waist
          const span = (yTop - yWaist) + FADE * 0.55;
          const H = MODEL_BASE_SIZE * 0.94;
          const k = H / (span || 1);
          rig.scale.setScalar(k);
          rig.position.y = -((yTop + yWaist) / 2 - FADE * 0.22) * k;

          /* Centred on the WHOLE upper body across the whole clip, not on the
             head and not on the first frame. Two corrections, both measured:

             the head alone put him a third of the cell off to the right, because
             his shoulder and the arm he raises swing well clear of it - the
             bones ran -0.31..1.04 against a cell of +/-1.0, so he was over the
             edge; and he leans a long way in across the 10.9s, so registering
             on frame 0 walks him out of frame by the middle of it. */
          const framed = ['mixamorigHead', 'mixamorigHeadTop_End',
                          'mixamorigLeftShoulder', 'mixamorigRightShoulder',
                          'mixamorigLeftHand', 'mixamorigRightHand',
                          'mixamorigSpine', 'mixamorigHips']
            .map((n) => rig.getObjectByName(n)).filter(Boolean);
          let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
          for (let i = 0; i <= 24; i++) {
            mixer.setTime((i / 24) * clipDur * 0.999);
            rig.updateMatrixWorld(true);
            for (const b of framed) {
              const q = b.getWorldPosition(V());
              x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x);
              z0 = Math.min(z0, q.z); z1 = Math.max(z1, q.z);
            }
          }
          /* NOT multiplied by k. The vertical measure above is taken before
             the rig is scaled, so it has to be; these samples are taken after,
             so they are already in scaled units and scaling them again pushed
             him a seventh of the cell off centre. */
          rig.position.x = -(x0 + x1) / 2;
          rig.position.z = -(z0 + z1) / 2;
          mixer.setTime(0);

          /* The cut. Done in the shader, in the mesh's own local space, so it
             rides the skinning and every transform above it without a single
             per-frame update - a world-space clipping plane would have had to
             be rewritten every frame as the icons float to the corners and
             then dock into the bar.

             A soft band rather than a hard edge, which is the same treatment
             the keyed video icons already use where the reference clip runs
             out of frame. */
          const cutHigh = yWaist, cutLow = yWaist - FADE;
          const NL = String.fromCharCode(10);
          const V_HEAD = ['#include <common>', 'varying float vLocalY;'].join(NL);
          const V_POS  = ['vLocalY = transformed.y;', '#include <project_vertex>'].join(NL);
          const F_HEAD = ['#include <common>', 'varying float vLocalY;',
                          'uniform float uCutLow;', 'uniform float uCutHigh;'].join(NL);
          const F_CUT  = ['#include <dithering_fragment>',
                          'float vCut = smoothstep(uCutLow, uCutHigh, vLocalY);',
                          'if (vCut <= 0.003) discard;',
                          'gl_FragColor.a *= vCut;'].join(NL);
          secretMat.onBeforeCompile = (sh) => {
            sh.uniforms.uCutLow = { value: cutLow };
            sh.uniforms.uCutHigh = { value: cutHigh };
            sh.vertexShader = sh.vertexShader
              .replace('#include <common>', V_HEAD)
              // project_vertex, not skinning_vertex: it is always present and
              // sits after the skin, so `transformed` is the final local point.
              .replace('#include <project_vertex>', V_POS);
            sh.fragmentShader = sh.fragmentShader
              .replace('#include <common>', F_HEAD)
              .replace('#include <dithering_fragment>', F_CUT);
          };
          secretMat.needsUpdate = true;
        }

        root.add(rig);
      }, undefined, () => { /* offline or file:// - the slot stays empty */ });

      root.userData.tick = function (t, opacity) {
        // Elapsed time, not a delta - setTime keeps the loop exact and comes
        // back in step after a spell in a background tab rather than catching
        // up through a burst of frames.
        if (mixer) mixer.setTime(t % clipDur);
        secretMat.opacity = opacity;
      };

      return root;
    }

    // Every slot is built and animated here; nothing is traced artwork any
    // more, and nothing is fetched.
    const MODEL_BUILDERS = [
      () => buildDoorwayModel(),
      () => buildHandshakeModel(),
      () => buildConsultationModel(),
      () => buildInsightsModel()
    ];


    // Each box gets a distinct resting tilt so the group reads as scattered
    // and "settled," not mechanically identical — echoing the reference look.
    // The Y component always turns the box's face toward screen-center: a
    // positive angle turns it right (for boxes on the left), negative turns
    // it left (for boxes on the right) — so every box reads face-on inward,
    // never showing its side/back toward the viewport edge.
    const BASE_ROT = [
      { x: 0.09, y: 0.26, z: 0.05 },     // Services — top-left, faces right/inward
      { x: -0.05, y: -0.20, z: -0.07 },  // Architect — top-right, faces left/inward
      { x: 0.10, y: 0.23, z: -0.04 },    // Consultation — bottom-left, faces right/inward
      { x: -0.07, y: -0.17, z: 0.06 }    // Insights — bottom-right, faces left/inward
    ];
    // Worst case a box ever tilts (base + mouse-parallax + hover kick), used
    // to size the screen-edge margin so a rotated box's swung-out corner
    // never leaves the viewport.
    const MAX_TILT_RAD = 0.26 + 0.16 + 0.1;

    const boxes = NAV_ITEMS.map((item, i) => {
      const mesh = MODEL_BUILDERS[i]();
      scene.add(mesh);
      return { mesh, item, phase: i * 1.7 };
    });
    // Debug handle, the same idea as the studio's __studio: the doorway's
    // timing can be read and stepped from the console.
    window.__navBoxes = { boxes, scene, camera, renderer };
    // Re-run now that every model has registered its materials: the call up
    // beside the palette ran before any of them existed, so a page opened
    // straight into the light theme would leave the video icon on the dark
    // tint until the reader happened to toggle.
    applyTheme(document.documentElement.dataset.theme);

    const buttons = NAV_ITEMS.map((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-box-btn';
      btn.type = 'button';
      // Visually hidden (color: transparent in CSS) — the visible caption is
      // the sibling .nav-box-label below; this just carries the click and
      // the accessible name, over a hit-area that spans card + caption.
      btn.textContent = item.label;
      btn.setAttribute('aria-label', item.label);
      btn.addEventListener('click', () => {
        const el = document.querySelector(item.target);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      root.appendChild(btn);
      return btn;
    });

    const labels = NAV_ITEMS.map((item) => {
      const el = document.createElement('div');
      el.className = 'nav-box-label';
      el.textContent = item.label;
      el.setAttribute('aria-hidden', 'true');
      root.appendChild(el);
      return el;
    });

    let hoverIndex = -1;
    buttons.forEach((btn, i) => {
      btn.addEventListener('mouseenter', () => { hoverIndex = i; });
      btn.addEventListener('mouseleave', () => { hoverIndex = -1; });
      btn.addEventListener('focus', () => { hoverIndex = i; });
      btn.addEventListener('blur', () => { hoverIndex = -1; });
    });

    const mouse = { x: 0, y: 0 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / vpW()) * 2 - 1;
      mouse.y = -(e.clientY / vpH()) * 2 + 1;
    });

    function resize() {
      const w = vpW(), h = vpH();
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    function getCornerTargets() {
      const w = vpW(), h = vpH();
      // Clears the navbar pill even when it's mid-transition into its wider
      // docked state (up to ~100px tall) — 78px was only enough for the
      // bare logo mark, not the expanded panel, and the two were colliding.
      const topClearance = 150;
      const bottomClearance = Math.min(60, h * 0.06) + 40; // room for the caption below each card
      const usableH = h - topClearance - bottomClearance;
      // Sized so the top and bottom rows can never collide, even on short
      // (laptop-height) viewports — the size shrinks before the gap does.
      const size = Math.max(60, Math.min(130, w * 0.095, usableH * 0.36));
      // A tilted square's screen-space half-width is (size/2)*(|cosθ|+|sinθ|),
      // not size/2 — so at the worst-case tilt the box needs meaningfully
      // more clearance than its own half-size, or its outer corner clips
      // past the viewport edge. +15% safety margin on top of the math.
      const tiltFactor = (Math.abs(Math.cos(MAX_TILT_RAD)) + Math.abs(Math.sin(MAX_TILT_RAD))) / 2;
      // Pulled in from the strict corner toward center — closer to the
      // letter card rather than pinned way out at the viewport edge, but
      // not so close it overlaps the card itself.
      const inwardPull = w * 0.02;
      const marginX = Math.max(size * tiltFactor * 1.3, 60) + inwardPull;
      const topY = topClearance + size / 2;
      const bottomY = h - bottomClearance - size / 2;
      return [
        { x: marginX, y: topY, size },                       // Projects — top-left
        { x: w - marginX, y: topY, size },                   // About — top-right
        { x: marginX, y: bottomY, size },                    // Gallery — bottom-left
        { x: w - marginX, y: bottomY, size }                 // Contact — bottom-right
      ];
    }
    // Independent dock anchor, top-right — deliberately not tied to the
    // brand pill (see .nav-dock-pill / dockPill above): the two are meant
    // to read as a separate, matching pair, not one joined bar.
    //
    // The pill's box is derived from what it actually has to contain rather
    // than being a round number the icons are then centered in: each item is
    // an icon with a caption *underneath* it, so the content block is taller
    // than the icon alone, and centering the icon on the pill's midline left
    // the caption hanging out past the bottom edge. Height is built up from
    // the parts instead, and the icons hang off the top padding.
    const DOCK_TOP = 22, DOCK_RIGHT = 22;
    const DOCK_PAD = 26, DOCK_PAD_Y = 11;
    const DOCK_ICON = 30, DOCK_GAP = 30;
    const DOCK_CAPTION_BLOCK = 15; // caption gap + its line box, beneath each icon
    const DOCK_HEIGHT = DOCK_PAD_Y * 2 + DOCK_ICON + DOCK_CAPTION_BLOCK;
    // The docked caption's type, kept here because getDockEdges has to measure
    // at exactly the size frame() renders at or the pill is sized for the
    // wrong string width.
    const DOCK_FONT_PX = 8, DOCK_TRACKING_EM = 0.06;
    // Gutter of clear space between one docked caption and the next.
    const DOCK_CAPTION_GUTTER = 12;

    // Each caption is wider than the icon above it, and they differ from each
    // other, so the row's real visual extent is set by the *captions*, not by
    // the icons. Padding the icon row symmetrically therefore left the whole
    // group sitting visibly off-centre inside the pill. Measure what the
    // captions actually occupy at their docked size and derive from those.
    //
    // The icon *pitch* comes out of the same measurement. A fixed
    // DOCK_ICON + DOCK_GAP (60px) only ever worked because the old captions
    // were single words; the longest of these labels is over twice that wide,
    // and at a fixed pitch adjacent captions would print straight through one
    // another. The pitch is therefore the wider of the icon spacing and the
    // widest caption plus a gutter — so the pill grows to fit whatever text
    // these four items are given, and no caption can ever collide with its
    // neighbour.
    let dockEdges = null;
    function getDockEdges() {
      if (dockEdges) return dockEdges;
      // Measured off body, not `root` — root is display:none whenever the
      // boxes are hidden, and a hidden subtree measures zero.
      const probe = document.createElement('div');
      probe.className = 'nav-box-label';
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;' +
                            `font-size:${DOCK_FONT_PX}px;letter-spacing:${DOCK_TRACKING_EM}em;`;
      document.body.appendChild(probe);
      const widths = NAV_ITEMS.map((item) => {
        probe.textContent = item.label;
        return probe.getBoundingClientRect().width;
      });
      probe.remove();
      const halves = widths.map((w) => w / 2);
      dockEdges = {
        left: Math.max(DOCK_ICON / 2, halves[0]),
        right: Math.max(DOCK_ICON / 2, halves[halves.length - 1]),
        pitch: Math.max(DOCK_ICON + DOCK_GAP, Math.max(...widths) + DOCK_CAPTION_GUTTER)
      };
      return dockEdges;
    }
    // A first measure can land before the webfont swaps in; drop it once the
    // real face is ready so the next frame re-measures against it.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { dockEdges = null; });
    }

    /* The OPEN box, which now has to hold the menu button as well as the four
       items - the button keeps its place at the right-hand end whether the row
       is out or not, so opening grows the pill leftwards away from it. */
    function getDockBox() {
      const e = getDockEdges();
      const span = (NAV_ITEMS.length - 1) * e.pitch; // first→last icon centre
      const width = DOCK_PAD + e.left + span + e.right + DOCK_PAD + MENU_W;
      const left = vpW() - DOCK_RIGHT - width;
      return { left, width, firstIconX: left + DOCK_PAD + e.left };
    }
    /* Where the button sits, and therefore where the icons collapse to. Fixed
       to the right edge, so it does not move as the row opens and shuts. */
    function getMenuAnchor() {
      return { x: vpW() - DOCK_RIGHT - MENU_W / 2, y: DOCK_TOP + MENU_H / 2 };
    }

    function getDockedTargets() {
      const { firstIconX } = getDockBox();
      const e = getDockEdges();
      const cy = DOCK_TOP + DOCK_PAD_Y + DOCK_ICON / 2;
      return NAV_ITEMS.map((_, i) => ({
        x: firstIconX + i * e.pitch, y: cy, size: DOCK_ICON
      }));
    }

    const unprojectVec = new THREE.Vector3();
    function screenToWorld(x, y, z) {
      const w = vpW(), h = vpH();
      unprojectVec.set((x / w) * 2 - 1, -(y / h) * 2 + 1, 0.5);
      unprojectVec.unproject(camera);
      const dir = unprojectVec.sub(camera.position).normalize();
      const dist = (z - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(dist));
    }

    let sectionTop = 0;
    function measure() {
      const rect = section.getBoundingClientRect();
      sectionTop = window.scrollY + rect.top;
    }
    measure();
    window.addEventListener('resize', measure);

    const clock = new THREE.Clock();
    const tmpScale = new THREE.Vector3();

    // The handshake icon learns its clip off a <video> that was never put in the
    // document, so hiding the canvas does not stop it decoding the way hiding
    // a DOM video would. Parked here alongside the render skip, for the same
    // reason the render is skipped — and this is what keeps it parked through
    // the whole first screenful, before the icons have any business moving.
    let iconsPlaying = true;
    function setIconsPlaying(on) {
      if (on === iconsPlaying) return;
      iconsPlaying = on;
      boxes.forEach((b) => {
        if (b.mesh.userData.setPlaying) b.mesh.userData.setPlaying(on);
      });
    }

    function frame() {
      requestAnimationFrame(frame);

      const scrollY = window.scrollY;
      const vh = window.innerHeight;

      // Matches the letter paper's own reveal window exactly (see the
      // Keyed to the letter's own two acts (see OpenLetterSection, which pins
      // across a 200vh section): the flap unseals over roughly the first 40%
      // of that scroll, the letter draws out over the next 40%. The boxes
      // come in alongside the letter — not while the envelope is still
      // sealed — then dock once it has been read. Docking still has to finish
      // before the Featured Projects title scrolls in, or the mid-flight
      // boxes cross over it.
      const revealStart = sectionTop + vh * 1.00;
      const revealEnd = sectionTop + vh * 1.45;
      const dockStart = sectionTop + vh * 2.00;
      const dockEnd = dockStart + vh * 0.35;

      let opacity;
      if (scrollY <= revealStart) opacity = 0;
      else if (scrollY < revealEnd) opacity = (scrollY - revealStart) / (revealEnd - revealStart);
      else opacity = 1;

      let dock = (scrollY - dockStart) / (dockEnd - dockStart);
      dock = Math.max(0, Math.min(1, dock));

      // Eased here, not in CSS - see the note on `spread` above.
      spread += ((menuOpen ? 1 : 0) - spread) * 0.16;
      if (Math.abs((menuOpen ? 1 : 0) - spread) < 0.001) spread = menuOpen ? 1 : 0;

      const isDocked = dock > 0.02;
      dockPill.classList.toggle('docked', isDocked);

      /* The button appears only once the icons have actually arrived, so it
         never sits there competing with them while they are still floating. */
      const anchor = getMenuAnchor();
      menuBtn.classList.toggle('is-visible', dock > 0.55);
      menuBtn.classList.toggle('is-open', menuOpen);
      menuBtn.style.left = `${anchor.x - 15}px`;
      menuBtn.style.top = `${anchor.y - 15}px`;
      if (dock <= 0.55 && menuOpen) setMenu(false);   // scrolled back up

      /* IT SQUEEZES BACK ON ITS OWN - the two ways a reader says they are done
         with it. Off the bar, or scrolled on.

         The region tested is the box the bar will occupy when fully open, not
         the one it currently occupies: measured against the animating width,
         a pointer resting where the row is about to arrive counts as outside
         it, and the bar would shut again the instant it was opened. */
      if (menuOpen) {
        const full = getDockBox();
        const out = ptrSeen && (
          ptrX < full.left - MENU_SLOP ||
          ptrX > full.left + full.width + MENU_SLOP ||
          ptrY < DOCK_TOP - MENU_SLOP ||
          ptrY > DOCK_TOP + DOCK_HEIGHT + MENU_SLOP);
        if (out || Math.abs(scrollY - menuScrollAt) > MENU_SCROLL_SHUT) setMenu(false);
      }

      if (isDocked) {
        const open = getDockBox();
        dockPill.style.width = `${MENU_W + (open.width - MENU_W) * spread}px`;
        dockPill.style.height = `${MENU_H + (DOCK_HEIGHT - MENU_H) * spread}px`;
      } else {
        dockPill.style.width = '0px';
        dockPill.style.height = '0px';
      }

      /* HOW MUCH OF AN ICON THERE IS TO SEE. Floating, all of it. Docked and
         shut, none - they are inside the button. Docked and open, all of it
         again. One number so the models, the captions and the hit areas can
         never disagree about it. */
      const iconAlpha = opacity * (1 - dock * (1 - spread));

      root.style.display = iconAlpha <= 0.001 ? 'none' : 'block';
      // Skip the render call entirely while hidden — three separate WebGL
      // contexts (this one, the featured cube, and briefly the loader) all
      // rendering every frame regardless of visibility was the source of
      // the occasional stutter/jank elsewhere on the page.
      if (iconAlpha <= 0.001) { setIconsPlaying(false); return; }
      setIconsPlaying(true);

      const corners = getCornerTargets();
      /* Collapsed into the button, then spread back out of it. At spread 0
         every icon shares the button's centre and is a few pixels across,
         which is what "stored in the menu" means geometrically. */
      const rowTargets = getDockedTargets();
      const docked = rowTargets.map((d) => ({
        x: anchor.x + (d.x - anchor.x) * spread,
        y: anchor.y + (d.y - anchor.y) * spread,
        size: 8 + (d.size - 8) * spread
      }));
      const t = clock.getElapsedTime();
      const idle = 1 - dock;
      const revealScale = 0.7 + 0.3 * opacity;

      // Shared across all four models — one write per frame instead of one
      // per box.
      platinumMat.opacity = iconAlpha;
      platinumEdgeMat.opacity = iconAlpha * 0.95;
      // The doorway figure's own alpha is written by its tick() below, which
      // multiplies this reveal opacity by how far through the door it is.
      manMat.opacity = iconAlpha;

      const distance = camera.position.z;
      const vFov = (camera.fov * Math.PI) / 180;
      const visibleH = 2 * Math.tan(vFov / 2) * distance;
      const pxToWorld = visibleH / vpH();
      const worldToPx = 1 / pxToWorld;

      boxes.forEach((b, i) => {
        const c = corners[i], d = docked[i];
        const px = c.x + (d.x - c.x) * dock;
        let py = c.y + (d.y - c.y) * dock;
        const sizePx = c.size + (d.size - c.size) * dock;

        // The float/bob is applied here, in screen space, *before* both the
        // mesh's world position and the label/button positions are derived
        // from (px, py) — so the caption and the click target move with
        // exactly the same floating motion as the 3D model, instead of the
        // model bobbing while the caption sits still beneath it.
        const bobPx = Math.sin(t * 1.2 + b.phase) * 8 * idle;
        py -= bobPx;

        const worldPos = screenToWorld(px, py, 0);
        b.mesh.position.lerp(worldPos, 0.22);

        const targetScale = ((sizePx * pxToWorld) / MODEL_BASE_SIZE) * revealScale;
        tmpScale.set(targetScale, targetScale, targetScale);
        b.mesh.scale.lerp(tmpScale, 0.22);

        const base = BASE_ROT[i];
        const hover = hoverIndex === i ? 1 : 0;
        const targetRotX = base.x * idle - mouse.y * 0.16 * idle;
        const targetRotY = base.y * idle + mouse.x * 0.16 * idle + hover * Math.sin(t * 5) * 0.1;
        const targetRotZ = base.z * idle + Math.sin(t * 0.5 + b.phase) * 0.04 * idle;
        b.mesh.rotation.x += (targetRotX - b.mesh.rotation.x) * 0.08;
        b.mesh.rotation.y += (targetRotY - b.mesh.rotation.y) * 0.08;
        b.mesh.rotation.z += (targetRotZ - b.mesh.rotation.z) * 0.08;

        b.mesh.visible = true;

        // Slot 0 carries a looping internal animation (the door and the
        // figure). It runs on this same rAF pass, so it is visibility-gated
        // for free: the early return above stops it along with the render
        // whenever the group is hidden.
        if (b.mesh.userData.tick) b.mesh.userData.tick(t, opacity);

        // Caption stays visible once docked too — just shrinks and tucks in
        // closer beneath the now-smaller icon instead of fading away.
        // Captions belong to the open row; collapsed, there is nothing to label.
        const labelOpacity = iconAlpha * (dock > 0.02 ? spread : 1);
        const labelGap = 10 - dock * 6;
        const label = labels[i];
        label.style.left = `${px}px`;
        label.style.top = `${py + sizePx / 2 + labelGap}px`;
        label.style.transform = 'translateX(-50%)';
        label.style.fontSize = `${13 - dock * (13 - DOCK_FONT_PX)}px`;
        label.style.letterSpacing = `${0.16 - dock * (0.16 - DOCK_TRACKING_EM)}em`;
        label.style.opacity = labelOpacity;

        // The click target spans the card plus the caption beneath it, for
        // a bigger, easier hit-area than the card alone.
        const btn = buttons[i];
        const hitH = sizePx + (labelOpacity > 0.05 ? labelGap + 18 : 0);
        btn.style.left = `${px - sizePx / 2}px`;
        btn.style.top = `${py - sizePx / 2}px`;
        btn.style.width = `${sizePx}px`;
        btn.style.height = `${hitH}px`;
        btn.style.opacity = iconAlpha;
        btn.style.pointerEvents = iconAlpha > 0.4 ? 'auto' : 'none';
        btn.classList.toggle('is-docked', dock > 0.5);
      });

      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }

  initNavBoxes();
</script>

<!-- ══════════════════════════════════════════════════════════════════════
     FEATURED PROJECTS CUBE — a pinned, scroll-scrubbed Three.js cube built
     from six planes sharing one texture (box/collage.png). It sits closed
     and completely still until scrolled to; the first half of the pinned
     scroll range blows it apart into an axonometric "exploded diagram"
     (each face flying out along its own normal, staggered so it reads as
     a wave), and the second half is a dwell where it stays fully open and
     the four side panels revolve around the vertical axis while the top
     and bottom stay fixed — a "lazy susan" beneath fixed caps — before the
     page finally releases and scrolls on.
════════════════════════════════════════════════════════════════════════ -->
<script type="module">
  import * as THREE from 'three';

  function initFeaturedCube() {
    const section = document.querySelector('.featured-cube-section');
    const stageEl = document.querySelector('.featured-cube-stage');
    const mount = document.querySelector('.featured-cube-canvas-mount');
    const titleEl = document.querySelector('.featured-cube-title');
    // setTimeout, not requestAnimationFrame — see the matching note in
    // initNavBoxes above.
    if (!section || !stageEl || !mount) { setTimeout(initFeaturedCube, 50); return; }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
    camera.position.set(0, 0, 15);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1006, 1.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.25); key.position.set(4, 6, 8); scene.add(key);
    const rim = new THREE.DirectionalLight(0xE0B480, 1.1); rim.position.set(-6, -3, 5); scene.add(rim);
    const fill = new THREE.DirectionalLight(0xffffff, 0.4); fill.position.set(0, -6, -4); scene.add(fill);

    const texLoader = new THREE.TextureLoader();
    const B64 = window.NAV_PHOTO_B64 || {};
    function loadTex(key, fallback) {
      const tex = texLoader.load(B64[key] || fallback);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    // The caps keep the original collage; each of the four sides gets its own
    // so the cube reads as four different projects rather than one repeated.
    /* Straight from a URL rather than through the embedded base64 copies: this
       one has no b64 twin, so it is the single face that needs the page to be
       SERVED rather than opened as a file. Everything else still works either
       way - see the note at the top of nav-photos.b64.js. */
    function loadUrlTex(url) {
      const t = texLoader.load(url);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const collageTex = loadTex('collage', './box/collage.jpg');
    const sideTex = [
      // Front — Mr. Rajendra's kitchen, matching ALL_PROJECTS[0].
      loadUrlTex('./projects/rajendra/slide-07.jpg'),
      loadTex('side1', './box/collage1.jpg'),
      loadTex('side2', './box/collage2.jpg'),
      loadTex('side3', './box/collage3.jpg')
    ];

    // Two nested groups: cubeGroup carries the shared idle-spin / view
    // rotation (everything, caps included); sidesGroup — a child of it —
    // carries only the four walls, and gets an extra continuous spin once
    // fully open. Top and bottom are added straight to cubeGroup, so that
    // extra spin never touches them.
    const cubeGroup = new THREE.Group();
    // Shifted down so the exploded top face clears the "Featured Projects"
    // title sitting above it, instead of growing straight up into it.
    cubeGroup.position.y = -0.9;
    scene.add(cubeGroup);
    const sidesGroup = new THREE.Group();
    cubeGroup.add(sidesGroup);

    const size = 3.1;
    const half = size / 2;
    // DoubleSide so a panel is never simply culled out of existence while it
    // swings through edge-on during the formation move — with the default
    // FrontSide, any panel momentarily facing away drops to a bare outline.
    const makeFaceMat = (map) => new THREE.MeshStandardMaterial({ map, roughness: 0.5, metalness: 0.12, side: THREE.DoubleSide });
    // One material per side so each carries its own collage.
    const sideMats = sideTex.map(makeFaceMat);
    // Pale gold linework washes out on the light theme's paper ground, so the
    // edges and the dashed guides deepen to a copper alongside it.
    const EDGE_GOLD = 0xE0B480, EDGE_GOLD_LIGHT = 0x8A5A2B;
    const edgeMat = new THREE.LineBasicMaterial({ color: EDGE_GOLD, transparent: true, opacity: 0.75 });
    const guideMats = [];
    const guideMat = () => {
      const m = new THREE.LineDashedMaterial({ color: EDGE_GOLD, dashSize: 0.14, gapSize: 0.1, transparent: true, opacity: 0 });
      guideMats.push(m);
      return m;
    };
    function applyCubeTheme(mode) {
      const c = mode === 'light' ? EDGE_GOLD_LIGHT : EDGE_GOLD;
      edgeMat.color.setHex(c);
      if (typeof capEdgeMat !== 'undefined') capEdgeMat.color.setHex(c);
      guideMats.forEach((m) => m.color.setHex(c));
    }
    window.addEventListener('ee-theme', (e) => applyCubeTheme(e.detail));

    function makeFace(parent, mat, emat) {
      const geo = new THREE.PlaneGeometry(size, size);
      const mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), emat);
      const group = new THREE.Group();
      group.add(mesh, edges);
      parent.add(group);
      return group;
    }

    // The caps get their own material (still the original collage) purely so
    // they can fade out on their own once the four walls break away into the
    // row — sharing a side's material would dim that wall along with them.
    const capMat = makeFaceMat(collageTex); capMat.transparent = true;
    const capEdgeMat = edgeMat.clone();
    // Now that capEdgeMat exists, sync everything to whatever theme is set.
    applyCubeTheme(document.documentElement.dataset.theme);

    const SIDE_KEYS = ['front', 'back', 'left', 'right'];
    const CAP_KEYS = ['top', 'bottom'];
    const FACE_KEYS = [...SIDE_KEYS, ...CAP_KEYS];
    const faces = {};
    SIDE_KEYS.forEach((k, i) => { faces[k] = makeFace(sidesGroup, sideMats[i], edgeMat); });
    CAP_KEYS.forEach((k) => { faces[k] = makeFace(cubeGroup, capMat, capEdgeMat); });

    // Each face keeps its own natural orientation the whole time — only its
    // distance from center changes. That's what reads as an "exploded
    // assembly" rather than a flattened unfold: every panel is still doing
    // the job it does on the cube, just pulled apart to show how it fits.
    const CLOSED = {
      front:  { p: [0, 0, half],  r: [0, 0, 0] },
      back:   { p: [0, 0, -half], r: [0, Math.PI, 0] },
      left:   { p: [-half, 0, 0], r: [0, -Math.PI / 2, 0] },
      right:  { p: [half, 0, 0],  r: [0, Math.PI / 2, 0] },
      top:    { p: [0, half, 0],  r: [-Math.PI / 2, 0, 0] },
      bottom: { p: [0, -half, 0], r: [Math.PI / 2, 0, 0] }
    };
    const NORMAL = {
      front: [0, 0, 1], back: [0, 0, -1], left: [-1, 0, 0],
      right: [1, 0, 0], top: [0, 1, 0], bottom: [0, -1, 0]
    };
    // Unit corners of a face, used to bound its projection on screen.
    const CORNERS = [[-1, 1], [1, 1], [1, -1], [-1, -1]];
    // Recomputed every frame from the live camera frustum (not a fixed
    // constant) — a face displaced along X or Y collapses to a flat sliver
    // in the perpendicular axis, so its worst-case reach is exactly
    // half + explodeDist. A flat "80% of the frustum" cutoff only kept the
    // top face clear of the title at the ~900px viewport height it was
    // tuned against — the title's own footprint is a fixed pixel size
    // (padding + text), so on a shorter browser window it eats a bigger
    // share of that same frustum and the tilted top face's corners (which
    // reach further up than its own center once the axonometric view angle
    // is applied) can climb into it. Measuring the title's actual pixel
    // height each frame and converting *that* to world units — instead of
    // guessing a flat percentage — keeps the reserved headroom correct at
    // any viewport height, not just the one this was last tested at.
    function getExplodeDist() {
      const dist = camera.position.z;
      const vFov = (camera.fov * Math.PI) / 180;
      const visibleH = 2 * Math.tan(vFov / 2) * dist;
      const visibleW = visibleH * camera.aspect;
      const vh = window.innerHeight;
      const worldPerPx = visibleH / vh;
      const titleBottomPx = (titleEl ? titleEl.getBoundingClientRect().bottom : 220) + 64; // + breathing room
      // cubeGroup sits 0.9 below world center (see above), which eats into
      // the *upward* headroom specifically — subtract it so the top face
      // still can't reach the title even at full explosion.
      // The top face's own corners swing higher than its center once the
      // axonometric tilt is applied (it's a flat plane pivoting into view,
      // not a point) — an extra ~0.7 world units at these tilt angles,
      // measured directly rather than derived, so budget for it too.
      const safeHalfH = (visibleH / 2) - titleBottomPx * worldPerPx - 0.9 - 1.0;
      const safeHalfW = (visibleW / 2) * 0.86;
      return Math.max(0.6, Math.min(safeHalfH, safeHalfW) - half);
    }

    const guideLines = {};
    FACE_KEYS.forEach((k) => {
      const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0)]);
      const line = new THREE.Line(geo, guideMat());
      scene.add(line);
      guideLines[k] = line;
    });

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Where the four walls end up once they stop orbiting: a flat, evenly
    // spaced, camera-facing row, sized off the live frustum so it fills the
    // width on any viewport instead of being a fixed world-space number.
    function getFormationLayout() {
      const vFov = (camera.fov * Math.PI) / 180;
      const visibleH = 2 * Math.tan(vFov / 2) * camera.position.z;
      const visibleW = visibleH * camera.aspect;
      // The row only claims the left ~74% — the rest is the right-hand margin
      // the "More Projects" arrow sits in, beside the last panel.
      // The composition is laid out as one band across almost the full frame
      // — four panels, then the arrow in its own slot at the right end —
      // rather than centring the row and letting the arrow hang off it. That
      // earlier version left a dead strip of frame past the arrow; this way
      // the whole width does work, which also buys real air between panels.
      const usableW = visibleW * 0.94;
      const leftEdge = -usableW / 2;
      const arrowSlot = Math.max(1.7, visibleW * 0.12);
      const rowW = usableW - arrowSlot;
      const GAP_RATIO = 0.30;                       // gap as a fraction of a panel's width
      const cardW = rowW / (4 + 3 * GAP_RATIO);
      const gap = cardW * GAP_RATIO;

      // Height gets a real budget rather than a flat fraction: the title's
      // footprint is a fixed pixel size, so on a short window it eats a much
      // bigger share of the frustum and a percentage-based row would grow
      // straight into it. Measure the gap between the title and the bottom
      // caption strip and fit the row inside it, centred on FORM_CENTER_Y.
      const mh = mount.clientHeight || 1;
      const worldPerPx = visibleH / mh;
      const titleBottom = (titleEl ? titleEl.getBoundingClientRect().bottom : 190) + 22;
      const topLimit = visibleH / 2 - titleBottom * worldPerPx;
      const bottomLimit = -visibleH / 2 + 64 * worldPerPx; // room for the names below
      const budget = Math.min(topLimit - FORM_CENTER_Y, FORM_CENTER_Y - bottomLimit) * 2;
      const cardH = Math.max(1.1, Math.min(cardW * 1.32, budget));
      return {
        visibleW, visibleH, cardW, cardH, gap, rowW,
        step: cardW + gap,
        firstX: leftEdge + cardW / 2,            // centre of panel 0
        arrowX: usableW / 2 - arrowSlot / 2      // centre of the arrow's slot
      };
    }

    /* These nodes are rendered by React, and React is free to throw them away
       and build new ones - a re-render of this section replaces the whole
       overlay. Holding references from module start therefore rots: the module
       carries on writing positions and opacities to detached nodes while the
       ones actually on screen sit untouched, which looks exactly like the
       animation having silently died. So the handles are re-fetched whenever
       the set it holds is no longer in the document. */
    let domCache = null;
    function overlay() {
      if (!domCache || !domCache.layer || !domCache.layer.isConnected) {
        domCache = {
          layer: document.querySelector('.formation-layer'),
          captions: [...document.querySelectorAll('.formation-caption')],
          cards: [...document.querySelectorAll('.formation-card')],
          rail: [...document.querySelectorAll('.rail-card')],
          on: document.querySelector('.rail-zone-on'),
          back: document.querySelector('.rail-zone-back')
        };
      }
      return domCache;
    }

    /* Travel is held here rather than derived from scroll position: the reader
       asks for it by putting the pointer at an edge, and it stays where they
       left it. `railTarget` is what the edges move; `railOffset` chases it, so
       the strip glides instead of tracking the pointer frame for frame. */
    let railOffset = 0, railTarget = 0, railDir = 0;
    /* Delegated from the document rather than bound to the zones themselves,
       for the same reason: a listener attached to a node React later discards
       goes with it. mouseover/mouseout are used because they bubble - the
       enter/leave pair does not, so it cannot be delegated. */
    document.addEventListener('mouseover', (e) => {
      const t = e.target instanceof Element ? e.target : null;
      if (!t) return;
      if (t.closest('.rail-zone-on')) railDir = 1;
      else if (t.closest('.rail-zone-back')) railDir = -1;
    });
    document.addEventListener('mouseout', (e) => {
      const t = e.target instanceof Element ? e.target : null;
      if (t && (t.closest('.rail-zone-on') || t.closest('.rail-zone-back'))) railDir = 0;
    });
    const projVec = new THREE.Vector3();

    function resize() {
      const w = mount.clientWidth || window.innerWidth;
      const h = mount.clientHeight || window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);
    /* The window is not the thing that changes. This canvas fills a mount
       inside the page, and that mount loses the scrollbar's width the moment
       the document grows tall enough to need one - which happens after this
       runs, as the rest of the page renders, and fires no resize event at all.
       The canvas was left sized to the wider pre-scrollbar layout while
       toScreen() divided by the mount's real width, so every projected x came
       out about 2% short and the DOM overlays drifted further left the further
       right they sat. Watching the element itself is the only way to catch it. */
    if (window.ResizeObserver) new ResizeObserver(resize).observe(mount);

    let sectionHeight = 0;
    function measure() {
      sectionHeight = section.getBoundingClientRect().height;
    }
    measure();
    window.addEventListener('resize', measure);

    const clock = new THREE.Clock();
    // A fixed resting tilt — no pre-open spin at all. The cube sits
    // completely still, closed or mid-open, until it's fully open, at
    // which point (and only then) the walls start their revolve.
    // The open cube's viewing angle - the axonometric it holds from the moment
    // it is on screen until the formation unwinds it.
    const VIEW_ROT = { x: -0.4, y: 0.58 };
    const REVOLVE_SPEED = 0.5; // rad/s — a full turn every ~12s
    // Scroll window (as a fraction of the pinned range) over which the open
    // cube resolves into the flat row of project panels. Deliberately wide —
    // combined with the taller section this sits in, the move now plays out
    // over roughly twice the scroll distance it used to, which is what stops
    // it feeling rushed.
    /* The pin only has to carry the cube: open, revolve, form the row. The
       rail is no longer on the scroll timeline, so the section does not need
       the extra height it did, and a reader who does not reach for the edge
       passes straight through to the stats. */
    const FORM_START = 0.14, FORM_END = 0.52;
    // Per-panel offset inside that window, so the four peel away in sequence.
    const FORM_STAGGER = (FORM_END - FORM_START) * 0.12;
    function sideFormP(idx, p) {
      const start = FORM_START + idx * FORM_STAGGER;
      const end = FORM_END - (SIDE_KEYS.length - 1 - idx) * FORM_STAGGER;
      return smoothstep(start, end, p);
    }
    const FORM_CENTER_Y = -0.35; // row sits just below centre, leaving room for the names
    let spinY = 0;               // running orbit angle, unwound by the formation
    const faceCur = {}; FACE_KEYS.forEach((k) => { faceCur[k] = 0; });
    const tmpFrom = new THREE.Vector3();
    const tmpTo = new THREE.Vector3();

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    // Continuous scroll-scrub (matching every other pinned section on this
    // page — the studio scene, the letter reveal, the nav-box
    // float/dock) rather than intercepting wheel events: that's the more
    // fragile approach and the one that was producing a bad-feeling, glitchy
    // animation. Ordinary scroll position drives everything here instead.
    let wasFixed = false;

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05);
      const vh = window.innerHeight;
      const rect = section.getBoundingClientRect();
      const pinRange = Math.max(1, sectionHeight - vh);

      // Skip the whole update (and the render call) while the section is
      // nowhere near the viewport — three separate WebGL contexts all
      // rendering full-time regardless of visibility was the source of the
      // occasional stutter/jank elsewhere on the page.
      const nearViewport = rect.bottom > -vh * 0.5 && rect.top < vh * 1.5;
      if (!nearViewport) {
        // Park the stage before bailing — see the matching note in
        // TeamCarousel. A stage left `fixed` after the reader jumps away
        // stays glued to the viewport over whatever they landed on.
        if (wasFixed) {
          const passed = rect.top < 0;
          stageEl.style.position = 'absolute';
          stageEl.style.top = passed ? 'auto' : '0';
          stageEl.style.bottom = passed ? '0' : 'auto';
          wasFixed = false;
        }
        return;
      }

      // Same manual-pin technique used elsewhere on this page: CSS `sticky`
      // is unreliable here because of the site's `overflow-x: hidden`. A
      // couple of pixels of hysteresis around the pin boundary keeps a
      // sub-pixel scroll wobble from flickering the position back and forth.
      const hyst = wasFixed ? 2 : -2;
      if (rect.top > hyst) {
        stageEl.style.position = 'absolute'; stageEl.style.top = '0'; stageEl.style.bottom = 'auto';
        wasFixed = false;
      } else if (rect.top <= hyst && rect.top > -pinRange - hyst) {
        stageEl.style.position = 'fixed'; stageEl.style.top = '0'; stageEl.style.bottom = 'auto';
        wasFixed = true;
      } else {
        stageEl.style.position = 'absolute'; stageEl.style.top = 'auto'; stageEl.style.bottom = '0';
        wasFixed = false;
      }

      let p = (0 - rect.top) / pinRange;
      p = Math.max(0, Math.min(1, p));

      // The burst plays out across roughly the first third of the pinned
      // scroll range — quick enough that it's fully open within a couple of
      // scroll gestures instead of feeling like a long wind-up — and the
      // remaining two-thirds is a dwell where the cube stays fully open and
      // the walls revolve, so there's real time to watch it before the page
      // finally releases.
      // The section is much taller now (see .featured-cube-section), so this
      // fraction is smaller than it looks: it still resolves the burst in
      // about the same amount of actual scrolling as before — it's the
      // phases after it that got the extra room.
      /* The cube is open the whole time and never closes. There is no burst
         beat any more: a scroll-driven explosion meant the section was
         approached as a shut box and only became the axonometric once you
         had scrolled into it, and the axonometric - walls apart, rooms on
         show - is the thing this section is actually for.

         So the faces sit at full separation from the outset, and the only
         thing held back on the approach is the revolve. */
      const explodeP = 1;

      // Third act: once the cube is open and has had a turn or two to
      // revolve, the four walls peel out of the orbit and settle into a flat
      // row of panels with their project names beneath. Everything that made
      // it read as a cube — the view tilt, the orbit, the caps, the dashed
      // guide lines — unwinds across this same window.
      const formP = smoothstep(FORM_START, FORM_END, p);
      const layout = getFormationLayout();

      // Always the open view; the formation unwinds it to face-on at the end.
      cubeGroup.rotation.x = VIEW_ROT.x * (1 - formP);
      cubeGroup.rotation.y = VIEW_ROT.y * (1 - formP);
      cubeGroup.position.y = lerp(-0.9, FORM_CENTER_Y, formP);

      /* The strip moves only while an edge is held. One slot further than the
         project count, so the last one comes to rest inside the band that
         reads at full strength rather than stopping in the right-hand slot
         where the dimming still has hold of it. */
      const railMax = (RAIL_PROJECTS.length + 1) * getFormationLayout().step;
      if (formP > 0.98 && railDir !== 0) {
        railTarget = Math.max(0, Math.min(railMax, railTarget + railDir * dt * railMax / 9));
      }
      // Wound back in as the row breaks up, so scrolling away and returning
      // never lands mid-rail with the cube half-formed.
      if (formP < 0.9) { railTarget = 0; }
      railOffset += (railTarget - railOffset) * Math.min(1, dt * 6);
      cubeGroup.position.x = -railOffset;

      // Keep the orbit angle in its own accumulator so the formation can
      // unwind it to face-on without the running total fighting back. It's
      // wrapped to one turn because it grows in real time, not with scroll:
      // left unbounded, the residual `spin * (1 - formP)` mid-unwind depends
      // on how many seconds the reader happened to watch the revolve, and a
      // large one turns the panels far enough to be back-face culled — they
      // drop to bare outlines partway through the move.
      /* Still until the section is genuinely reached. `p` only leaves 0 once
         the stage pins, so on the approach - where the cube is already open
         and in view - the accumulator simply does not advance and the walls
         hang motionless. The moment the section takes the viewport, they
         start turning. */
      if (p > 0 && formP < 1) {
        spinY = (spinY + dt * REVOLVE_SPEED) % (Math.PI * 2);
      }
      // Unwind the short way round: past half a turn it's closer to keep
      // going forward to a full turn than to rewind to zero.
      const spinTarget = spinY > Math.PI ? Math.PI * 2 : 0;
      sidesGroup.rotation.y = lerp(spinY, spinTarget, formP);

      const explodeDist = getExplodeDist();

      FACE_KEYS.forEach((key, i) => {
        // Staggered per-face window so the burst reads as a wave, not a
        // single mechanical snap.
        const start = 0.1 + i * 0.05;
        const end = 0.7 + i * 0.05;
        const e = smoothstep(start, end, explodeP);
        faceCur[key] = e;

        const closed = CLOSED[key];
        const n = NORMAL[key];
        const group = faces[key];
        const ex = closed.p[0] + n[0] * explodeDist * e;
        const ey = closed.p[1] + n[1] * explodeDist * e;
        const ez = closed.p[2] + n[2] * explodeDist * e;

        const sideIdx = SIDE_KEYS.indexOf(key);
        if (sideIdx !== -1) {
          // Each panel gets its own slightly offset window inside the shared
          // formation range, so they peel out of the orbit and land one after
          // another instead of snapping into place as one block — that
          // sequencing is most of what makes the move read as composed
          // rather than mechanical. All four still finish by FORM_END.
          const f = sideFormP(sideIdx, p);
          // A shallow push toward the camera at the midpoint of the flight,
          // easing back to zero on arrival: the panels travel on a gentle arc
          // instead of sliding flat across the frame.
          const zArc = Math.sin(f * Math.PI) * 1.15;
          group.position.set(
            lerp(ex, layout.firstX + sideIdx * layout.step, f),
            lerp(ey, 0, f),
            lerp(ez, 0, f) + zArc
          );
          group.rotation.set(
            lerp(closed.r[0], 0, f),
            lerp(closed.r[1], 0, f),
            lerp(closed.r[2], 0, f)
          );
          group.scale.set(
            lerp(1, layout.cardW / size, f),
            lerp(1, layout.cardH / size, f),
            1
          );
        } else {
          group.position.set(ex, ey, ez);
          group.rotation.set(closed.r[0], closed.r[1], closed.r[2]);
          // Caps have no place in the row — they drift on out and fade.
          group.position.multiplyScalar(1 + formP * 0.6);
        }

        // Guide lines are scene-level (not nested in cubeGroup), so both
        // ends need true world coordinates — a face's world position must
        // go through getWorldPosition to pick up cubeGroup's translation
        // and rotation (and, for the walls, sidesGroup's extra spin too).
        const line = guideLines[key];
        tmpFrom.set(0, 0, 0);
        cubeGroup.getWorldPosition(tmpFrom);
        group.getWorldPosition(tmpTo);
        line.geometry.setFromPoints([tmpFrom, tmpTo]);
        line.computeLineDistances();
        line.material.opacity = e * 0.55 * (1 - formP);
      });

      capMat.opacity = 1 - formP;
      capEdgeMat.opacity = 0.75 * (1 - formP);
      faces.top.visible = faces.bottom.visible = formP < 0.99;

      // The captions and the arrow are HTML, so they're placed by projecting
      // each panel's own world position to screen — that way they stay glued
      // to the panels no matter the viewport or how the row is sized.
      const ov = overlay();
      if (ov.layer) {
        ov.layer.style.opacity = formP;
        ov.layer.style.pointerEvents = formP > 0.9 ? 'auto' : 'none';
        if (formP > 0.01) {
          scene.updateMatrixWorld(true);
          const mw = mount.clientWidth, mh = mount.clientHeight;
          const toScreen = (v) => {
            v.project(camera);
            return { x: (v.x * 0.5 + 0.5) * mw, y: (-v.y * 0.5 + 0.5) * mh };
          };
          SIDE_KEYS.forEach((key, idx) => {
            const cap = ov.captions[idx];
            if (!cap) return;
            // Local (0, -half, 0) is the panel's own bottom edge, so this
            // follows the scale-up as the row forms rather than guessing.
            projVec.set(0, -half, 0);
            faces[key].localToWorld(projVec);
            const s = toScreen(projVec);
            cap.style.left = `${s.x}px`;
            cap.style.top = `${s.y + 22}px`;
            // Each name waits for its own panel to nearly land, so the names
            // arrive in the same order the panels do.
            const landed = smoothstep(0.72, 1.0, sideFormP(idx, p));
            cap.style.opacity = landed;

            /* The hover card is laid over the same panel. Its box comes from
               the panel's own projected corners rather than from the layout
               numbers, so it tracks the scale-up and can never drift off the
               picture. Kept inert until the panel has essentially landed -
               a hit-box over a panel that is still flying would catch the
               pointer somewhere the reader cannot see anything. */
            const card = ov.cards[idx];
            if (card) {
              /* All four corners, not two. While the row is still forming the
                 panel is not yet square to the camera, so it projects as a
                 trapezium - and a box built from one diagonal pair then sits
                 inside that shape and leaves a wedge of photograph showing
                 down one edge. Taking min/max across every corner bounds the
                 quad whatever its orientation. */
              let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
              CORNERS.forEach(([cx, cy]) => {
                projVec.set(cx * half, cy * half, 0);
                faces[key].localToWorld(projVec);
                const s2 = toScreen(projVec);
                if (s2.x < x0) x0 = s2.x;
                if (s2.y < y0) y0 = s2.y;
                if (s2.x > x1) x1 = s2.x;
                if (s2.y > y1) y1 = s2.y;
              });
              /* Bled outward before use. The projection is exact to the
                 geometry, but what is actually drawn is wider than that: the
                 panel carries an EdgesGeometry outline that sits proud of its
                 own boundary, and the raster antialiases a further part-pixel
                 beyond. Measured against the rendered frame, a panel spanning
                 21..135 was being boxed at 20..132 - hence the sliver of
                 photograph down the right edge. Scaled rather than fixed so it
                 still covers when the row is drawn large. */
              const bleed = 2;
              const bx = x0 - bleed, by = y0 - bleed;
              const bw = (x1 - x0) + bleed * 2, bh = (y1 - y0) + bleed * 2;
              card.style.left = `${bx}px`;
              card.style.top = `${by}px`;
              card.style.width = `${bw}px`;
              card.style.height = `${bh}px`;
              // The plane's type is sized off the panel's own width, because
              // the row scales with the viewport - a fixed size that suits a
              // 320px panel is unreadable on a 110px one.
              card.style.setProperty('--cw', `${bw}px`);

              /* Live only once the WHOLE row has settled, not merely once this
                 panel has. `landed` is per-panel and the first one lands well
                 before the last, but the view rotation that squares the panels
                 up is driven by the shared formP - so a panel could be
                 hoverable while still turned, where no rectangle can cover it
                 exactly. Waiting for both is what guarantees the plane sits
                 flush on the photograph. */
              const live = landed > 0.98 && formP > 0.995;
              card.style.pointerEvents = live ? 'auto' : 'none';
              card.style.opacity = live ? 1 : 0;
            }
          });
          /* The rail. Every card past the fourth is placed at its own slot in
             the same world layout the panels use, then projected exactly as
             they are - so the DOM cards and the WebGL panels cannot drift
             apart no matter what the camera is doing. Travel is applied to
             cubeGroup itself, which moves panels and cards together as one
             strip. */
          const zonesLive = formP > 0.98;
          [ov.back, ov.on].forEach((z) => {
            if (!z) return;
            z.style.pointerEvents = zonesLive ? 'auto' : 'none';
          });
          if (ov.back) ov.back.style.opacity = zonesLive && railOffset > 4 ? 1 : 0;
          if (ov.on) ov.on.style.opacity = zonesLive && railOffset < railMax - 4 ? 1 : 0;

          ov.rail.forEach((card, i) => {
            const slot = layout.firstX + (i + 4) * layout.step;
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            CORNERS.forEach(([cx, cy]) => {
              projVec.set(slot + cx * layout.cardW / 2, cy * layout.cardH / 2, 0);
              cubeGroup.localToWorld(projVec);
              const s2 = toScreen(projVec);
              if (s2.x < x0) x0 = s2.x;
              if (s2.y < y0) y0 = s2.y;
              if (s2.x > x1) x1 = s2.x;
              if (s2.y > y1) y1 = s2.y;
            });
            const w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2;
            card.style.left = `${x0}px`;
            card.style.top = `${y0}px`;
            card.style.width = `${w}px`;
            card.style.height = `${h}px`;
            card.style.setProperty('--cw', `${w}px`);

            /* Dimmed while it is still ahead of you and brightening as it
               arrives. The one sitting at the right-hand edge is the hint that
               there is more to come; anything already off the left is spent. */
            const ahead = smoothstep(mw * 0.58, mw * 0.94, cx);
            const gone = 1 - smoothstep(-w * 0.5, w * 0.25, cx);
            const vis = formP * (1 - gone) * (0.26 + 0.74 * (1 - ahead));
            card.style.opacity = vis;
            /* Hit-testing is decided on whether the card is actually on
               screen, not on how brightly it is drawn. Tying it to `vis` meant
               a card only became hoverable once it had brightened past a
               threshold, so the ones sitting toward the right - the very ones
               a reader reaches for first as they come in - stayed inert while
               plainly visible. Anything not dimmed to near-nothing and not
               past the left edge takes the pointer. */
            const onScreen = cx > -w * 0.35 && cx < mw + w * 0.35;
            card.style.pointerEvents = (onScreen && vis > 0.12) ? 'auto' : 'none';
          });

        }
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }

  initFeaturedCube();
</script>
